<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">LocalChromeStore catalog</title>
  <desc id="desc">Real application capture using clearly labeled sample catalog data</desc>
  <rect width="1680" height="1080" rx="32" fill="#070A12"/>
  <rect x="40" y="20" width="298" height="38" rx="19" fill="#172033" stroke="#22D3EE" stroke-width="1"/>
  <circle cx="62" cy="39" r="5" fill="#22D3EE"/>
  <text x="78" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.4" fill="#CFFAFE">REAL APP / SAMPLE CATALOG</text>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".42"/>
    </filter>
    <clipPath id="frame"><rect x="40" y="74" width="1600" height="966" rx="16"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <image href="../screenshots/catalog-app.png" x="40" y="74" width="1600" height="966" clip-path="url(#frame)"/>
    <rect x="40" y="74" width="1600" height="966" rx="16" fill="none" stroke="#45475A" stroke-width="2"/>
  </g>
</svg>
