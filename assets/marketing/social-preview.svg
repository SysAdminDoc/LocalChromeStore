<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">LocalChromeStore</title>
  <desc id="desc">A private Windows catalog for Chromium extensions</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B14"/><stop offset="1" stop-color="#11182B"/></linearGradient>
    <radialGradient id="glow" cx="20%" cy="20%" r="75%"><stop stop-color="#7C3AED" stop-opacity=".35"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <clipPath id="shot"><rect x="676" y="92" width="552" height="334" rx="14"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <image href="../brand/icon.svg" x="62" y="58" width="104" height="104"/>
  <text x="190" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="720" letter-spacing="2.8" fill="#89DCEB">WINDOWS DESKTOP APP</text>
  <text x="190" y="149" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="43" font-weight="780" fill="#F8FAFC">LocalChromeStore</text>
  <text x="62" y="264" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="780" letter-spacing="-1.5" fill="#F8FAFC">
    <tspan x="62" dy="0">Your extensions.</tspan>
    <tspan x="62" dy="66" fill="#CBA6F7">One private catalog.</tspan>
  </text>
  <text x="65" y="397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" fill="#BAC2DE">
    <tspan x="65" dy="0">Discover, verify, install, and launch</tspan>
    <tspan x="65" dy="34">Chromium extensions from one Windows app.</tspan>
  </text>
  <image href="../screenshots/catalog-app.png" x="676" y="92" width="552" height="334" clip-path="url(#shot)"/>
  <rect x="676" y="92" width="552" height="334" rx="14" fill="none" stroke="#585B70" stroke-width="2"/>
  <rect x="698" y="446" width="274" height="36" rx="18" fill="#111827" stroke="#22D3EE"/>
  <text x="721" y="470" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#CFFAFE">REAL APP / SAMPLE CATALOG</text>
  <path d="M62 526h1166" stroke="#313244" stroke-width="2"/>
  <text x="64" y="575" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" fill="#A6E3A1">LOCAL-FIRST</text>
  <text x="265" y="575" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" fill="#89B4FA">HASH VERIFIED</text>
  <text x="500" y="575" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" fill="#89DCEB">MULTI-BROWSER</text>
  <text x="754" y="575" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" fill="#CBA6F7">POLICY TOOLS</text>
  <text x="1030" y="575" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#7DD3FC">SysAdminDoc</text>
</svg>
